  BatchStateMachineArn:
    Value: !Ref BatchStateMachine
  BatchGlueJob:
    Value: !Ref BatchGlueJob
  AthenaWorkGroup:
    Value: !Ref AthenaWorkGroup
  CatalogDatabase:
    Value: !Ref CatalogDatabase
  AlertTopicArn:
    Value: !Ref AlertTopic
  DataKeyArn:
    Value: !GetAtt DataKey.Arn
